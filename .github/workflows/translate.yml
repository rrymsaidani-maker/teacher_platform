name: Translate messages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start LibreTranslate (free, no key)
        run: |
          docker run -d --name libretranslate -p 5000:5000 \
            libretranslate/libretranslate --load-only en,ar,fr,es
          for i in $(seq 1 90); do
            if curl -fs http://localhost:5000/languages > /dev/null; then
              echo "LibreTranslate is ready"; exit 0
            fi
            sleep 10
          done
          docker logs libretranslate | tail -50
          exit 1

      - name: Test the engine
        run: |
          curl -s -X POST http://localhost:5000/translate -H "Content-Type: application/json" -d '{"q":"Edit profile","source":"en","target":"ar","format":"text"}'
          echo
          curl -s -X POST http://localhost:5000/translate -H "Content-Type: application/json" -d '{"q":"Edit profile","source":"en","target":"fr","format":"text"}'
          echo
          docker logs libretranslate 2>&1 | grep -i "load\|error\|model\|language" | tail -30

      - name: Translate missing and English-copied keys
        env:
          LT_URL: http://localhost:5000
        run: node scripts/translate-messages.mjs

      - name: Check translations
        run: node scripts/check-translations.mjs

      - name: Commit translations
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update ar, fr and es translations"
          file_pattern: messages/ar.json messages/fr.json messages/es.json
